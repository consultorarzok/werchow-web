<section class="hero" id="inicio" data-active="memorial">
  <div class="hero-media" aria-hidden="true">
    <div class="hero-kenburns"></div>

    <video class="hero-video" id="heroVideo" autoplay muted loop playsinline>
      <source id="heroVideoSourceMobile" src="assets/hero-loop-memorial-mobile.mp4" type="video/mp4" media="(max-width: 640px)">

  </div>

  <div class="container hero-content">

    <div class="hero-actions">
      <a class="btn btn-primary" id="heroWaBtn" href="https://wa.me/5493884300930?text=Hola%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n%20sobre%20Memorial%20y%20Salas" target="_blank" rel="noopener">Más información →</a>
      <a class="btn btn-outline" href="tel:+543884225555">Llamar a Werchow</a>
    </div>
    <div class="hero-stat">
      <div class="fc-icon" id="heroFcIcon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.6-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.4-9.5 9-9.5 9Z" stroke="#fff" stroke-width="1.6"/></svg></div>

  <div class="hero-scrollcue" aria-hidden="true"></div>
